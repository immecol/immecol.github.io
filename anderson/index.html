<!doctype html>
<html lang="es">
<title>Anderson Quintero · IMMECOL</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Open+Sans:wght@400;600&display=swap">
<style>
/* Una pantalla: escena 3D a pantalla completa (túnel iluminado) y la tarjeta de contacto encima. Diseño oscuro único, colores de marca IMMECOL. */
:root {
  --petroleo: #003E57; --noche: #001B28; --ambar: #F2B42E; --naranja: #E8892B;
  --texto: #F2F6F8; --suave: #A9C2CE; --vidrio: rgba(0, 37, 54, .72); --borde: rgba(159, 208, 227, .22);
  --f-titulo: 'Montserrat', 'Segoe UI', Arial, sans-serif; --f-texto: 'Open Sans', 'Segoe UI', Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--noche); color: var(--texto); font-family: var(--f-texto); overflow: hidden; }
#escena { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.capa { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: flex-start; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(env(safe-area-inset-top, 0px) + 16px) calc(env(safe-area-inset-bottom, 0px) + 16px); }
.cabecera { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.marca { display: flex; align-items: center; gap: 10px; font: 800 15px/1 var(--f-titulo); letter-spacing: .08em; }
.marca img { width: 30px; height: 30px; }
.marca small { display: block; font: 500 8.5px/1.4 var(--f-titulo); letter-spacing: .18em; color: var(--ambar); margin-top: 3px; }
.escenas { pointer-events: auto; display: flex; gap: 4px; background: var(--vidrio); border: 1px solid var(--borde); border-radius: 999px; padding: 3px; backdrop-filter: blur(8px); }
.escenas button { all: unset; cursor: pointer; font: 600 11px/1 var(--f-titulo); padding: 8px 10px; border-radius: 999px; color: var(--suave); }
.escenas button[aria-pressed="true"] { background: var(--ambar); color: var(--noche); }
.escenas button:focus-visible, .acciones a:focus-visible, .acciones button:focus-visible { outline: 2px solid var(--ambar); outline-offset: 2px; }
[hidden] { display: none !important; }
.pista { margin-bottom: 10px; transition: opacity .4s; text-align: center; font: 500 11px var(--f-titulo); letter-spacing: .14em; color: var(--suave); text-transform: uppercase; }
.tarjeta { pointer-events: auto; width: 100%; max-width: 440px; margin-inline: auto; box-sizing: border-box; background: var(--vidrio);
  border: 1px solid var(--borde); border-radius: 18px; padding: 18px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.tarjeta h1 { margin: 0; font: 700 22px/1.15 var(--f-titulo); text-wrap: balance; }
.cargo { margin: 6px 0 0; font: 600 12px var(--f-titulo); color: var(--ambar); letter-spacing: .06em; }
.datos { margin: 14px 0 0; display: grid; gap: 6px; font-size: 13.5px; }
.datos div { display: flex; gap: 10px; align-items: center; min-width: 0; }
.datos span:last-child { overflow-wrap: anywhere; user-select: all; }
.datos svg { width: 15px; height: 15px; fill: var(--ambar); flex: none; }
.acciones { margin-top: 16px; display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 8px; }
.acciones a, .acciones button { all: unset; cursor: pointer; box-sizing: border-box; text-align: center; padding: 11px 8px; border-radius: 11px;
  font: 600 12.5px/1.2 var(--f-titulo); border: 1px solid var(--borde); color: var(--texto); }
.acciones .principal { grid-column: 1 / -1; background: var(--ambar); color: var(--noche); border-color: transparent; }
.acciones [aria-disabled="true"] { opacity: .55; cursor: default; }
.sedes { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--borde); display: grid; gap: 4px; font-size: 11.5px; color: var(--suave); }
.bandera { display: inline-block; width: 11px; height: 11px; border-radius: 50%; vertical-align: -1px; margin-right: 6px; }
.aviso { min-height: 1.2em; margin-top: 8px; font-size: 11.5px; color: var(--ambar); text-align: center; }
.tarjeta { padding: 14px 16px; margin-top: auto; }
.aviso:empty { display: none; }
.encabezado { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.encabezado h1 { font-size: 19px; }
.plegar { all: unset; cursor: pointer; flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--borde); display: grid; place-items: center; color: var(--ambar); }
.plegar svg { width: 16px; height: 16px; transition: transform .25s; }
.plegar[aria-expanded="true"] svg { transform: rotate(180deg); }
.plegar:focus-visible { outline: 2px solid var(--ambar); outline-offset: 2px; }
.rapidas { margin-top: 12px; grid-template-columns: minmax(0,1.4fr) minmax(0,1fr); }
.rapidas .principal { grid-column: auto; }
.detalle .acciones { margin-top: 8px; grid-template-columns: repeat(3, minmax(0,1fr)); }
.detalle .datos { margin-top: 12px; }
#video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
.sonido { all: unset; pointer-events: auto; cursor: pointer; align-self: center; margin-top: 10px; font: 600 11px/1 var(--f-titulo); padding: 8px 14px; border-radius: 999px; background: var(--vidrio); border: 1px solid var(--borde); color: var(--texto); }
.sonido:focus-visible { outline: 2px solid var(--ambar); outline-offset: 2px; }
@media (min-width: 900px) { .tarjeta { margin-inline: 0; max-width: 380px; } }
</style>

  // ---------- Túnel: bóveda en herradura, luminarias LED y vía ----------
  const tunel = new THREE.Group(); escena.add(tunel);
  const ANCHO = 9, ALTO_MURO = 2.2, LARGO = 70, PASO = 3.5;

    const s = new THREE.Shape(), r = ANCHO / 2, e = 0.35;
    s.moveTo(-r - e, 0); s.lineTo(-r - e, ALTO_MURO); s.absarc(0, ALTO_MURO, r + e, Math.PI, 0, true); s.lineTo(r + e, 0);

  const red = new THREE.Group(); red.visible = false; escena.add(red);

  suelo.rotation.x = -Math.PI / 2; suelo.position.z = -45; red.add(suelo);

    riel.position.set(x, .05, -50); red.add(riel);

  red.add(new THREE.HemisphereLight(0x9fc4d6, 0x000a10, .9));

  function sprite(escala, op) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: brillo, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: op, fog: false }));

  const cabeza = sprite(3.2, 1), destello = sprite(5, 0);
  const estela = []; for (let i = 0; i < 46; i++) estela.push(sprite(1.3 * (1 - i / 46) + .35, .8 * (1 - i / 46)));
  function hilo(n, color) {
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));

  // ---------- Cámara e interacción ----------
  let modo = 'red', avance = 0, yaw = 0, pitch = 0, arrastrando = false, px = 0, py = 0, tocado = false;
  lienzo.addEventListener('pointerdown', function (e) { arrastrando = true; px = e.clientX; py = e.clientY; lienzo.setPointerCapture(e.pointerId); });
  lienzo.addEventListener('pointermove', function (e) {
    if (!arrastrando) return;
    yaw -= (e.clientX - px) * .005; pitch -= (e.clientY - py) * .004; pitch = Math.max(-.6, Math.min(.6, pitch));
    px = e.clientX; py = e.clientY;
    if (!tocado) { tocado = true; document.getElementById('pista').style.opacity = 0; }
  });
  lienzo.addEventListener('pointerup', function () { arrastrando = false; });

  function poner(m) {
    modo = m; tunel.visible = m === 'tunel'; grupoEmblema.visible = m === 'emblema'; red.visible = m === 'red';
    const enVideo = m === 'video';
    video.hidden = !enVideo; lienzo.style.visibility = enVideo ? 'hidden' : 'visible';
    document.getElementById('sonido').hidden = !enVideo; document.getElementById('pista').hidden = enVideo;
    if (enVideo) { video.currentTime = 0; const pr = video.play(); if (pr) pr.catch(function () {}); } else video.pause();
    document.getElementById('btnVideo').setAttribute('aria-pressed', enVideo);
    escena.fog.near = m === 'red' ? 20 : 8; escena.fog.far = m === 'tunel' ? 62 : m === 'red' ? 110 : 200; yaw = 0; pitch = 0;
    luzCam.visible = m === 'tunel';
    document.getElementById('btnRed').setAttribute('aria-pressed', m === 'red');
    document.getElementById('btnTunel').setAttribute('aria-pressed', m === 'tunel');
    document.getElementById('btnEmblema').setAttribute('aria-pressed', m === 'emblema');
  }
  // Recorrido automático: empieza en Túnel y cambia de escena solo mientras nadie toque la pantalla.
  const ORDEN = ['tunel', 'red', 'emblema', 'video'], DURA = { tunel: 12000, red: 15000, emblema: 10000 };
  let auto = true, temporizador = null;
  function programar() {
    clearTimeout(temporizador);
    if (!auto || modo === 'video') return;      // el video avanza al terminar
    temporizador = setTimeout(siguiente, DURA[modo]);
  }
  function siguiente() { if (!auto) return; poner(ORDEN[(ORDEN.indexOf(modo) + 1) % ORDEN.length]); programar(); }
  function detenerAuto() { auto = false; clearTimeout(temporizador); }
  video.addEventListener('ended', function () { if (auto) siguiente(); else { video.currentTime = 0; video.play().catch(function () {}); } });
  lienzo.addEventListener('pointerdown', detenerAuto);
  video.addEventListener('pointerdown', detenerAuto);
  ['Tunel', 'Red', 'Emblema', 'Video'].forEach(function (n) {
    document.getElementById('btn' + n).onclick = function () { detenerAuto(); poner(n.toLowerCase()); };
  });
  document.getElementById('sonido').onclick = function () {
    detenerAuto(); video.muted = !video.muted; this.textContent = video.muted ? 'Activar sonido' : 'Silenciar';
    if (video.paused) video.play().catch(function () {});
  };
  const plegar = document.getElementById('plegar'), detalle = document.getElementById('detalle');
  plegar.onclick = function () {
    const abrir = plegar.getAttribute('aria-expanded') !== 'true';
    plegar.setAttribute('aria-expanded', abrir); detalle.hidden = !abrir;
    plegar.setAttribute('aria-label', abrir ? 'Ocultar datos de contacto' : 'Ver todos los datos de contacto');
  };

  function ajustar() {
    const w = window.innerWidth, h = window.innerHeight;
    render.setSize(w, h, false); camara.aspect = w / h; camara.updateProjectionMatrix();
  }
  window.addEventListener('resize', ajustar); ajustar();
  poner('tunel'); programar();

  const reloj = new THREE.Clock();
  function cuadro() {
    const dt = Math.min(reloj.getDelta(), .05), t = reloj.elapsedTime;
    if (!arrastrando) { yaw *= .985; pitch *= .985; }
    if (modo === 'red') {
      camara.position.set(.6, 3, 9);
      camara.rotation.set(pitch - .12, yaw + .03, 0, 'YXZ');
      animarRed(t);
    } else if (modo === 'tunel') {
      if (!reducir) avance = (avance + dt * 3.2) % (LARGO - 16);
      camara.position.set(Math.sin(t * .3) * .4, 1.9, -avance + 2);
      camara.rotation.set(pitch + .03, yaw, 0, 'YXZ');
      luzCam.position.copy(camara.position);
    } else {
      const r = 9.5;
      camara.position.set(Math.sin(yaw + (reducir ? 0 : t * .25)) * r, pitch * 6, Math.cos(yaw + (reducir ? 0 : t * .25)) * r);
      camara.lookAt(0, 0, 0);
      grupoEmblema.children.forEach(function (c) { if (c.geometry.type === 'PlaneGeometry') c.lookAt(camara.position.x * .15, camara.position.y * .15, 9); });
      anillos.forEach(function (a, i) { a.rotation.z = t * (.25 + i * .08) * (i % 2 ? -1 : 1); });
    }
    if (modo !== 'video') render.render(escena, camara);
    requestAnimationFrame(cuadro);
  }
  cuadro();

  // ---------- Contacto (vCard) ----------
  const VCARD = ['BEGIN:VCARD', 'VERSION:3.0', 'N:Quintero Molina;Anderson;;;', 'FN:Anderson Quintero Molina', 'ORG:IMMECOL S.A.S.', 'TITLE:Desarrollador de Negocios LATAM',
    'TEL;TYPE=CELL:+57 313 837 9998', 'EMAIL;TYPE=WORK:anderson.quintero@immecol.com', 'URL:https://www.immecol.com',
    'ADR;TYPE=WORK:;;Carrera 103 # 24 - 54;Bogotá;;110911;Colombia', 'END:VCARD'].join('\r\n');
  document.getElementById('guardar').onclick = function () {
    const aviso = document.getElementById('aviso');
    try {
      const url = URL.createObjectURL(new Blob([VCARD], { type: 'text/vcard' }));
      const a = document.createElement('a'); a.href = url; a.download = 'Anderson-Quintero-IMMECOL.vcf'; document.body.appendChild(a); a.click(); a.remove();
      aviso.textContent = 'Abra el archivo descargado para guardar el contacto.';
    } catch (e) { aviso.textContent = 'No se pudo generar el contacto en esta vista previa.'; }
  };
  document.getElementById('ra').onclick = function () {
    document.getElementById('aviso').textContent = 'Realidad aumentada: fase 2, con un modelo 3D (.glb) de IMMECOL.';
  };
})();
</script>
